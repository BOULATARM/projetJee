version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - cybertwin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cybertwin:cybertwin@db:5432/cybertwin
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    networks:
      - cybertwin

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cybertwin
      - POSTGRES_PASSWORD=cybertwin
      - POSTGRES_DB=cybertwin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cybertwin

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - cybertwin

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cybertwin
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cybertwin

volumes:
  postgres_data:
  ollama_data:

networks:
  cybertwin:
    driver: bridge
