---
# Hardening baseline applied on every deployment

- name: Set kernel security parameters (sysctl)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  become: true
  loop:
    - { name: net.ipv4.tcp_syncookies,       value: "1" }
    - { name: net.ipv4.conf.all.rp_filter,   value: "1" }
    - { name: net.ipv4.conf.all.accept_redirects, value: "0" }
    - { name: net.ipv6.conf.all.accept_redirects, value: "0" }
    - { name: kernel.randomize_va_space,     value: "2" }

- name: Disable unnecessary services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  become: true
  ignore_errors: true
  loop:
    - telnet
    - rsh
    - rlogin
    - rexec
    - ypserv
    - tftp

- name: Install security tools
  ansible.builtin.dnf:
    name:
      - fail2ban
      - aide
      - audit
    state: present
  become: true

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  become: true

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  become: true

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.conf
    content: |
      [sshd]
      enabled  = true
      port     = ssh
      maxretry = 5
      bantime  = 3600
      findtime = 600
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart fail2ban

- name: Set SSH hardening config
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED - LIAS security"
    block: |
      PermitRootLogin no
      PasswordAuthentication no
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
  become: true
  notify: Restart sshd

handlers:
  - name: Restart fail2ban
    ansible.builtin.systemd:
      name: fail2ban
      state: restarted
    become: true

  - name: Restart sshd
    ansible.builtin.systemd:
      name: sshd
      state: restarted
    become: true
